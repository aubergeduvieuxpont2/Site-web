<!DOCTYPE html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <!-- Per-page <title>, description, canonical, Open Graph and JSON-LD are
         emitted by the <Seo> component (see $lib/components/Seo.svelte). -->
    <meta name="theme-color" content="#f7f9fb" />
    <link rel="icon" href="/favicon.svg" />
    <link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "Auberge du Vieux Pont",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "111 Avenue Saint-Michel",
          "addressLocality": "Saint-Raymond",
          "addressRegion": "QC",
          "postalCode": "G3L 0H8",
          "addressCountry": "CA"
        },
        "telephone": "+1-418-399-9847",
        "url": "https://www.aubergeduvieuxpont.ca"
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
